# The Xcode project is generated from this file — run `xcodegen` after
# changing it, and never edit JUI.xcodeproj by hand (it is not committed).
name: JUI
options:
  bundleIdPrefix: com.nidhin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JUI:
    type: application
    platform: iOS
    sources:
      - path: JUI/Sources
      # Art ships as directories, as on the Mac: the app enumerates what is
      # in them, so a re-export of a different length needs no code change.
      - path: JUI/Resources/Textures
        type: folder
        buildPhase: resources
      - path: JUI/Resources/FlourishFrames
        type: folder
        buildPhase: resources
      # Courier Prime (SIL Open Font License — the licence ships beside it).
      - path: JUI/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: JUI/Resources/Assets.xcassets
    info:
      path: JUI/Info.plist
      properties:
        CFBundleDisplayName: JUI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        UIApplicationSupportsIndirectInputEvents: true
        UIAppFonts:
          - Fonts/CourierPrime-Regular.ttf
          - Fonts/CourierPrime-Italic.ttf
          - Fonts/CourierPrime-Bold.ttf
          - Fonts/CourierPrime-BoldItalic.ttf
        # Notes are plain files in Documents, visible in the Files app as
        # On My iPhone › JUI — the phone's version of "readable in Finder".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nidhin.jui.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # One icon per mood; cream is the primary. See AppIcon.swift.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-mint AppIcon-sky AppIcon-coral AppIcon-lilac AppIcon-orchid
        CODE_SIGN_STYLE: Automatic
        # Free Apple ID ("Personal Team"). Installs from Xcode last 7 days.
        DEVELOPMENT_TEAM: 4D82W6FABK
        ENABLE_PREVIEWS: YES
  JUITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JUITests
    dependencies:
      - target: JUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nidhin.jui.ios.tests
  JUIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JUIUITests
    dependencies:
      - target: JUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nidhin.jui.ios.uitests
        TEST_TARGET_NAME: JUI
schemes:
  JUI:
    build:
      targets:
        JUI: all
        JUITests: [test]
        JUIUITests: [test]
    test:
      targets:
        - JUITests
        - JUIUITests
    run:
      config: Debug
